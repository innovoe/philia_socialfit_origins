<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FBF8F7">
  <meta name="description" content="A private SocialFit preview for Origins, the Dubai First Wave.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>SocialFit Origins Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-head: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --font-body: Inter, Arial, sans-serif;
      --font-label: Montserrat, Arial, sans-serif;
      --color-ink: #202034; --color-muted: #6F6C69; --color-paper: #FFFDF9;
      --color-canvas: #FBF8F7; --color-panel: #F2ECE5; --color-line: #E8E0D9; --color-accent: #B30D12;
    }
    @layer base {
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { @apply m-0 bg-canvas text-ink font-body text-[15px] leading-[1.8] antialiased; }
      button { @apply cursor-pointer text-ink; }
      button:disabled { @apply cursor-default opacity-35; }
      button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #B30D12; outline-offset: 5px; }
    }
    @layer components {
      .site-shell { @apply mx-auto my-[34px] max-w-[620px] overflow-hidden rounded-[28px] border border-[#EEE9E4] bg-paper px-12 pb-14 pt-12 shadow-[0_18px_50px_rgba(32,32,52,.06)] max-[1000px]:mx-5 max-[1000px]:my-6 max-[680px]:m-0 max-[680px]:rounded-none max-[680px]:border-0 max-[680px]:px-6 max-[680px]:pt-10 max-[680px]:shadow-none; }
      .eyebrow { @apply font-label text-[9px] font-bold uppercase leading-[1.6] tracking-[1.7px] text-accent; }
      .primary-btn { @apply inline-flex min-h-[52px] w-full items-center justify-center rounded-[14px] border border-[#050507] bg-[#050507] px-6 py-3.5 font-label text-[12px] font-semibold leading-[1.5] text-paper transition hover:bg-[#29292F]; }
      .text-btn { @apply border-0 bg-transparent px-0 py-2.5 text-[12px] font-medium text-muted; }
      .field { @apply w-full rounded-[14px] border border-[#DDD4CB] bg-paper px-[18px] py-[15px] text-[15px] text-ink outline-none transition placeholder:text-[#B0AAA4] focus:border-[#050507]; }
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emailForm = document.getElementById('email-form');
      const codeForm = document.getElementById('code-form');
      const emailInput = document.getElementById('origins-email');
      const codeInput = document.getElementById('origins-code');
      const emailError = document.getElementById('email-error');
      const codeError = document.getElementById('code-error');
      const emailSubmit = document.getElementById('email-submit');
      const codeSubmit = document.getElementById('code-submit');
      const sentTo = document.getElementById('sent-to');
      const validEmail = value => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());

      async function post(path, body) {
        const response = await fetch(path, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'request_failed');
        return data;
      }

      function show(step) {
        emailForm.hidden = step !== 'email';
        codeForm.hidden = step !== 'code';
      }

      emailInput.addEventListener('input', () => {
        emailSubmit.disabled = !validEmail(emailInput.value);
      });
      codeInput.addEventListener('input', () => {
        codeSubmit.disabled = !codeInput.value.trim();
      });

      emailForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (emailSubmit.disabled) return;
        emailError.hidden = true;
        emailSubmit.disabled = true;
        emailSubmit.textContent = 'Checking…';
        try {
          const email = emailInput.value.trim().toLowerCase();
          await post('/api/access/start', { email });
          sentTo.textContent = email;
          codeInput.value = '';
          codeError.hidden = true;
          codeSubmit.disabled = true;
          show('code');
          codeInput.focus();
        } catch (error) {
          emailError.textContent = error.message === 'unknown_email'
            ? 'This email is not on the Origins list.'
            : error.message === 'email_send_failed'
              ? 'We couldn’t send that code. Try again shortly.'
              : error.message === 'throttled'
                ? 'Please wait a moment and try again.'
                : 'We couldn’t check that email yet. Please try again.';
          emailError.hidden = false;
        } finally {
          emailSubmit.textContent = 'Continue';
          emailSubmit.disabled = !validEmail(emailInput.value);
        }
      });

      codeForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (codeSubmit.disabled) return;
        codeError.hidden = true;
        codeSubmit.disabled = true;
        codeSubmit.textContent = 'Verifying…';
        try {
          await post('/api/access/verify', {
            email: emailInput.value.trim().toLowerCase(),
            code: codeInput.value.trim()
          });
          window.location.replace('/');
        } catch (error) {
          codeError.textContent = error.message === 'invalid_code'
            ? 'That code didn’t match. Please try again.'
            : error.message === 'unknown_email'
              ? 'This email is not on the Origins list.'
              : error.message === 'throttled'
                ? 'Please wait a moment and try again.'
                : 'We couldn’t verify that code yet. Please try again.';
          codeError.hidden = false;
          codeSubmit.disabled = !codeInput.value.trim();
        } finally {
          codeSubmit.textContent = 'Enter the preview';
        }
      });

      document.getElementById('use-other-email').addEventListener('click', () => {
        codeInput.value = '';
        codeError.hidden = true;
        show('email');
        emailInput.focus();
      });
    });
  </script>
</head>
<body>
<div class="site-shell">
  <div class="mb-10 font-label text-[29px] font-bold leading-none tracking-[-1.5px]">socialfit<small class="mt-[9px] block font-body text-[9px] font-medium uppercase tracking-[.2em]">by Philia Life</small></div>
  <div class="eyebrow">For Origins eyes only</div>
  <h1 class="mt-[18px] font-head text-[48px] font-normal leading-[1.02] tracking-[-1px] max-[680px]:text-[40px]">This is a private<br>first look.</h1>

  <form id="email-form" class="mt-8">
    <label class="mb-2.5 block font-label text-[11px] font-semibold" for="origins-email">Invitation email</label>
    <input id="origins-email" class="field" type="email" name="email" autocomplete="email" inputmode="email" required placeholder="name@email.com">
    <p class="mt-3.5 text-[11px] leading-[1.7] text-muted">Enter the email that received your Origins invitation. We’ll send a verification code if it’s on the list.</p>
    <p id="email-error" hidden class="mt-3.5 text-[12px] text-accent"></p>
    <button id="email-submit" type="submit" class="primary-btn mt-7" disabled>Continue</button>
  </form>

  <form id="code-form" class="mt-8" hidden>
    <label class="mb-2.5 block font-label text-[11px] font-semibold" for="origins-code">Verification code</label>
    <input id="origins-code" class="field tracking-[.2em]" type="text" name="code" inputmode="text" autocomplete="one-time-code" required placeholder="Enter your code">
    <p class="mt-3.5 text-[11px] leading-[1.7] text-muted">We sent a code to <span id="sent-to" class="text-ink"></span>.</p>
    <p id="code-error" hidden class="mt-3.5 text-[12px] text-accent"></p>
    <button id="code-submit" type="submit" class="primary-btn mt-7" disabled>Enter the preview</button>
    <button id="use-other-email" type="button" class="text-btn mt-3 w-full">Use a different email</button>
  </form>

  <p class="mt-10 text-[11px] text-muted">Dubai First Wave. Personal invitation required.</p>
</div>
</body>
</html>
